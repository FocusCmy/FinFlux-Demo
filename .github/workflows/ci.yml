name: finflux-ci

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - shell: pwsh
        run: ./scripts/FinFlux.ps1 -Action Validate
