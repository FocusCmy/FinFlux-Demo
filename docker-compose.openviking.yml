services:
  openviking:
    # The version is intentionally pinned.  VikingBot is disabled because
    # FinFlux only consumes the context database HTTP API.
    image: ${OPENVIKING_IMAGE:-ghcr.io/volcengine/openviking:v0.4.16@sha256:46f9e34cd37238c28cbd9535033773d179006bdf7f3e528dd1c46567abce7701}
    container_name: finflux-openviking
    command: ["--without-bot"]
    environment:
      OPENVIKING_WITH_BOT: "0"
    ports:
      - "127.0.0.1:${OPENVIKING_PORT:-1933}:1933"
    volumes:
      - ./.openviking:/app/.openviking
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1933/ready', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
